name: Update
run-name: ${{github.actor}} is updating capkgs

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "14 14 * * 1-5"

permissions:
  contents: read

# Publishing must not restore state written by less trusted Actions jobs.
cache-mode: none

concurrency:
  group: capkgs-publish
  cancel-in-progress: false

jobs:
  update:
    # This workflow has no PR trigger or PR checkout. Protect main and review
    # workflow changes in repository settings; this condition limits dispatches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          # packages.cr commits packages.json and pushes to main.
          persist-credentials: true

      - name: Prepare main branch at the triggering commit
        run: |
          git checkout -B main "$GITHUB_SHA"
          git config branch.main.remote origin
          git config branch.main.merge refs/heads/main

      - name: Free up disk space
        run: |
          pwd
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /opt/ghc \
            /opt/az
          sudo docker image prune --all --force
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://cache.iog.io https://cache.nixos.org/
            min-free = 1073741824
            max-free = 2147483648
            secret-key-files = /home/runner/work/capkgs/capkgs/hydra_key
            experimental-features = fetch-closure flakes nix-command

      - name: CI eval, build, cache push and commit
        run: |
          set -euo pipefail
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          umask 077
          trap 'rm -f hydra_key .netrc' EXIT
          printf '%s\n' "$NIX_SIGNING_KEY" > hydra_key
          printf '%s\n' "$IOHK_DEVOPS_NETRC_FILE" > .netrc
          NETRC_FILE="$PWD/.netrc"
          export NETRC_FILE
          echo "Current api rate limit status:"
          curl --netrc -s https://api.github.com/rate_limit | jq .rate
          nix develop \
          --ignore-environment \
          --keep AWS_ACCESS_KEY_ID \
          --keep AWS_SECRET_ACCESS_KEY \
          --keep CI \
          --keep LOG_LEVEL \
          --keep S3_ENDPOINT \
          --keep NETRC_FILE \
          --command just ci
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          LOG_LEVEL: "debug"
          NIX_SIGNING_KEY: "${{ secrets.NIX_SIGNING_KEY }}"
          NIX_SIGNING_KEY_FILE: "/home/runner/work/capkgs/capkgs/hydra_key"
          IOHK_DEVOPS_NETRC_FILE: "${{ secrets.IOHK_DEVOPS_NETRC_FILE }}"
          S3_ENDPOINT: "${{ secrets.S3_ENDPOINT }}"
